<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sith Holocron</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="brand">
        <!-- A holocron, drawn in CSS rather than an image. -->
        <span class="holocron-mark" aria-hidden="true"></span>
        <span class="brand-text">Sith Holocron</span>
      </div>
      <div class="search-area">
        <span class="material-symbols-outlined">search</span>
        <input type="text" placeholder="Search the archives" disabled />
      </div>
    </nav>

    <main>
      <!-- Create / edit form -->
      <form class="note-form">
        <input
          type="text"
          class="note-title"
          placeholder="A title for this teaching"
        />
        <textarea
          class="note-text"
          rows="3"
          placeholder="Inscribe your knowledge…"
        ></textarea>
        <div class="form-footer">
          <button type="submit" class="submit-btn">Inscribe</button>
        </div>
      </form>

      <!-- Empty-vault message, toggled by app.js -->
      <p class="empty-state">
        The vault is empty. Record your first teaching above.
      </p>

      <!-- Notes render in here -->
      <section class="notes"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
